```html
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кешірші ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffd1dc);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 75px;
            animation: beat 1.2s infinite;
        }

        h1 {
            color: #e91e63;
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            color: #555;
            font-size: 19px;
            line-height: 1.7;
        }

        button {
            margin-top: 15px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #c2185b;
        }

        #message {
            display: none;
            margin-top: 25px;
            color: #e91e63;
            font-size: 21px;
            line-height: 1.6;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: float 6s linear infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        @keyframes float {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>Кешірші...</h1>

    <p>
        Мен сені ренжітіп қойғанымды түсіндім.
        <br>
        Сол үшін шын жүрегіммен кешірім сұраймын.
        <br><br>
        Сен мен үшін өте қымбат адамсың ❤️
        <br>
        Арамыздың жақсы болғанын қалаймын.
    </p>

    <button onclick="showMessage()">
        Кешіресің бе? ❤️
    </button>

    <div id="message">
        Рақмет саған ❤️
        <br>
        Сенің көңіліңді қайтадан қалдырмауға тырысамын.
    </div>

</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}

// Ұшып жүретін жүректер
function createHeart() {
    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
